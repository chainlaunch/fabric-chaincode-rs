name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build, test, lint (no protoc — proves the default build needs none)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Build workspace
        run: cargo build --workspace --all-targets

      - name: Run tests
        run: cargo test --workspace

      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

  regenerate-protos:
    name: Verify the opt-in proto-regeneration path still builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc (with well-known types)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build with regenerate-protos
        run: cargo build -p fabric-shim-protos --features regenerate-protos

  security:
    name: Supply-chain audit (cargo-audit + cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo-audit (known vulnerabilities)
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: cargo-deny (licenses, bans, advisories, sources)
        uses: EmbarkStudios/cargo-deny-action@v2

  fuzz:
    name: Smoke-fuzz the protocol boundary
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [decode_chaincode_message, decode_proposal_chain, composite_key_roundtrip]
    steps:
      - uses: actions/checkout@v4

      # Pinned, not the floating `nightly` channel: that floated onto a
      # rustc nightly with a codegen ICE compiling tokio under
      # ASan+sancov instrumentation (unrelated to any change in this repo
      # -- reproduced/bisected 2026-07-24, confirmed nightly-2026-07-21
      # builds the same fuzz targets cleanly). Bump this date deliberately
      # when there's a reason to, not by every nightly's default drift.
      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-21

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target\nfuzz -> target"

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Fuzz ${{ matrix.target }} (60s smoke run)
        # Short per-PR smoke run, not exhaustive — catches regressions like
        # the composite-key round-trip bug this suite found on day one.
        # Run longer locally (`cargo +nightly fuzz run <target> --
        # -max_total_time=3600`) for deeper coverage.
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=60

  docker:
    name: Build example image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build asset-transfer image
        run: docker build -f examples/asset-transfer/Dockerfile -t asset-transfer:ci .

      - name: Smoke test the container
        run: |
          docker run -d --name smoke -e CHAINCODE_ID=smoke_1.0:0000 asset-transfer:ci
          sleep 2
          docker logs smoke
          docker logs smoke 2>&1 | grep -q "chaincode server listening"
          docker rm -f smoke

  differential-fabric:
    name: Differential test vs. official Go chaincode (real Fabric network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run differential test
        run: ./scripts/differential-test.sh
