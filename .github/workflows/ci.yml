name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc (with well-known types)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Build workspace
        run: cargo build --workspace --all-targets

      - name: Run tests
        run: cargo test --workspace

      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

  docker:
    name: Build example image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build asset-transfer image
        run: docker build -f examples/asset-transfer/Dockerfile -t asset-transfer:ci .

      - name: Smoke test the container
        run: |
          docker run -d --name smoke -e CHAINCODE_ID=smoke_1.0:0000 asset-transfer:ci
          sleep 2
          docker logs smoke
          docker logs smoke 2>&1 | grep -q "chaincode server listening"
          docker rm -f smoke
