[package]
name = "fabric-shim-protos"
description = "Generated gRPC/protobuf bindings for the Hyperledger Fabric chaincode shim protocol (Fabric 3.x)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
prost.workspace = true
prost-types.workspace = true
tonic.workspace = true
tonic-prost.workspace = true

[build-dependencies]
tonic-prost-build = { workspace = true, optional = true }

[features]
# Recompile the vendored .proto files instead of using the bindings
# committed under src/generated/. Requires protoc + libprotobuf-dev.
# Only needed when changing fabric-shim-protos/protos/.
regenerate-protos = ["dep:tonic-prost-build"]
